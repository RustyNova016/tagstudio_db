name: Rust
permissions:
  contents: read

on:
  push:
    branches: [ "master", "main", "develop"]
  pull_request:
    branches: [ "master", "main", "develop" ]

jobs:

  checks:
    env: 
      SQLX_OFFLINE: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Relative diff
        run: |
          git branch -av
          git diff origin/${{ github.base_ref }}.. | tee git.diff

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore and save Nix store
        uses: nix-community/cache-nix-action@v7
        with:
          # restore and save a cache using this key
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          # if there's no cache hit, restore a cache by this prefix
          restore-prefixes-first-match: nix-${{ runner.os }}-
          # collect garbage until the Nix store size (in bytes) is at most this number
          # before trying to save a new cache
          # 1G = 1073741824
          gc-max-store-size-linux: 1G
          # do purge caches
          purge: true
          # purge all versions of the cache
          purge-prefixes: nix-${{ runner.os }}-
          # created more than this number of seconds ago
          purge-created: 0
          # or last accessed this duration (ISO 8601 duration format)
          # before the start of the `Post Restore and save Nix store` phase
          purge-last-accessed: P1DT12H
          # except any version with the key that is the same as the `primary-key`
          purge-primary-key: never
          
      - uses: Swatinem/rust-cache@v2

      - name: Run fmt test
        shell: 'nix develop -c bash -e {0}'
        run: cargo fmt --all --check

      - name: Run cargo docs
        shell: 'nix develop -c bash -e {0}'
        run: cargo doc --all-features --no-deps --document-private-items

      - name: Run cargo-machete
        shell: 'nix develop -c bash -e {0}'
        run: cargo machete 

      - name: Run clippy no features
        shell: 'nix develop -c bash -e {0}'
        run: cargo hack clippy --no-default-features -- -D warnings

      - name: Run clippy
        shell: 'nix develop -c bash -e {0}'
        run: cargo hack clippy --all-features -- -D warnings

      - name: Run Tests
        shell: 'nix develop -c bash -e {0}'
        run: cargo test --all-features


